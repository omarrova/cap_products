_schema-version: 3.3.0
ID: product
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: product-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      NODE_ENV: production
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: gem-hana-db-v2
      - name: gem-xsuaa-service
      - name: product-destination

  - name: product-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: gem-hana-db-v2

resources:
  - name: gem-hana-db-v2
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: gem-xsuaa-service
    type: com.sap.xs.uaa
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: product-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite